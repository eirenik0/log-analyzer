# Template: custom-start
#
# 1) Copy this file to config/profiles/<your-team>.toml
# 2) Customize whole-message command_rules and request/event marker strings
# 3) Add known components/commands/requests for profile insights

profile_name = "custom-start"

[parser]
# Event patterns (examples: Emit event of type "X" with payload {...})
event_emit_markers = ["Emit event of type"]
event_receive_markers = ["Received event of type"]
event_payload_separator = "with payload"

# Command pattern (example: Command "sync" is called with settings {...})
command_payload_markers = ["with settings"]

# Request pattern (example: Request "fetchUser" will be sent ... with body {...})
request_prefix = "Request \""
request_send_markers = ["will be sent"]
request_receive_markers = ["finished successfully", "respond with"]
request_payload_markers = ["with body"]
request_endpoint_marker = "address \"["

# JSON extraction hints
json_indicators = [
  "with settings {",
  "with body [",
  "with body {",
  "with body",
  "with body "
]

[perf]
# Legacy command pairing markers are replaced by command_rules below.

# Key(s) used to correlate request/response-like event pairs
event_correlation_keys = ["key"]

[profile]
# Optional: known entities (used by `info` profile insights)
known_components = ["api", "worker"]
known_commands = ["sync", "publish"]
known_requests = ["fetchUser", "createOrder"]

[[sessions.levels]]
# Optional: generic session hierarchy inferred from component_id path segments
name = "level-1"
segment_prefix = "trace-"

[[sessions.levels]]
name = "level-2"
segment_prefix = "span-"

# Whole-message command grammar. Correlation also requires [perf] scope fields.
[command_rules]
version = 1

[[command_rules.rules]]
id = "command-start"
[command_rules.rules.adapter]
type = "text"
pattern = 'Command (?P<name>"(?:[^"\\]|\\.)*") (?:is called)(?: (?:with settings) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }

[[command_rules.rules]]
id = "command-end"
[command_rules.rules.adapter]
type = "text"
pattern = 'Command (?P<name>"(?:[^"\\]|\\.)*") (?:finished|finished successfully|returned|completed)(?: (?:with settings) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
outcome = { from = "literal", value = "success" }

[[command_rules.rules]]
id = "command-identity"
[command_rules.rules.adapter]
type = "text"
pattern = 'Command (?P<name>"(?:[^"\\]|\\.)*")'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
