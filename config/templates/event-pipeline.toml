# Template: event-pipeline
#
# Good for event-driven systems where queue/topic activity is primary.
# Example lines expected by this profile:
# - bus | ... [INFO ] Published "InvoiceCreated" payload {...}
# - bus | ... [INFO ] Consumed "InvoiceCreated" payload {...}
# - worker | ... [INFO ] Stage "enrich" begin with settings {...}
# - worker | ... [INFO ] Stage "enrich" done with settings {...}

profile_name = "event-pipeline"

[parser]
event_emit_markers = ["Published", "Emitted"]
event_receive_markers = ["Consumed", "Received"]
event_payload_separator = "payload"

command_payload_markers = ["with settings", "config"]

request_prefix = "Call \""
request_send_markers = ["started", "dispatched"]
request_receive_markers = ["done", "completed", "failed"]
request_payload_markers = ["payload", "with body"]
request_endpoint_marker = "target \"["

json_indicators = [
  "with settings {",
  "config {",
  "payload [",
  "payload {",
  "payload",
  "with body [",
  "with body {",
  "with body"
]

[perf]
event_correlation_keys = ["key", "eventId", "traceId", "jobId"]

[profile]
known_components = ["bus", "worker", "scheduler", "dead-letter"]
known_commands = ["enrich", "validate", "persist", "retry"]
known_requests = ["fetchTemplate", "loadConfig", "ack"]

[[sessions.levels]]
name = "level-1"
segment_prefix = "job-"

[[sessions.levels]]
name = "level-2"
segment_prefix = "trace-"

# Whole-message command grammar. Correlation also requires [perf] scope fields.
[command_rules]
version = 1

[[command_rules.rules]]
id = "command-start"
[command_rules.rules.adapter]
type = "text"
pattern = 'Stage (?P<name>"(?:[^"\\]|\\.)*") (?:begin|started)(?: (?:with settings|config) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }

[[command_rules.rules]]
id = "command-end"
[command_rules.rules.adapter]
type = "text"
pattern = 'Stage (?P<name>"(?:[^"\\]|\\.)*") (?:done|completed)(?: (?:with settings|config) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
outcome = { from = "literal", value = "success" }

[[command_rules.rules]]
id = "command-failure"
[command_rules.rules.adapter]
type = "text"
pattern = 'Stage (?P<name>"(?:[^"\\]|\\.)*") (?:failed)(?: (?:with settings|config) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
outcome = { from = "literal", value = "failure" }

[[command_rules.rules]]
id = "command-identity"
[command_rules.rules.adapter]
type = "text"
pattern = 'Stage (?P<name>"(?:[^"\\]|\\.)*")'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
