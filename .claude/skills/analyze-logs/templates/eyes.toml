profile_name = "eyes"

[parser]
event_payload_separator = "with payload"
command_payload_markers = ["with settings", "with default driver and settings"]
request_payload_markers = ["with body"]
request_endpoint_marker = "address \"["
json_indicators = ["with settings {", "with body [", "with body {", "with body", "with body "]

[perf]
event_correlation_keys = ["key"]

[profile]
detection_requires_session_scope = true
known_components = [
  "core",
  "core-base",
  "core-classic",
  "core-ufg",
  "core-universal",
  "core-autonomous",
  "core-requests",
  "core-requests-offline",
  "driver",
  "ec-client",
  "nml-client",
  "ufg-client",
  "ufg-requests",
  "socket",
  "tunnel-client",
  "ec-tunnel-manager",
  "cypress-plugin",
  "offline-exec",
  "screenshoter"
]
known_commands = [
  "makeManager",
  "openEyes",
  "check",
  "getResults",
  "abort",
  "closeBatch",
  "close",
  "deleteTest",
  "getAccountInfo",
  "takeSnapshots",
  "getBaseEyes"
]
known_requests = [
  "openEyes",
  "openFunctionalSession",
  "openCheckAndClose",
  "openCheckAndCloseEyes",
  "check",
  "checkAndClose",
  "close",
  "closeEyes",
  "abort",
  "closeBatch",
  "deleteTest",
  "report",
  "getResults",
  "getAccountInfo",
  "updateIfScm",
  "sendHeartbeat",
  "heartbeat",
  "logEvent",
  "logEventBatch",
  "matchWindow",
  "locate",
  "locateText",
  "extractText",
  "startRenders",
  "getRenderResults",
  "getActualEnvironments",
  "getChromeEmulationDevices",
  "getIOSDevices",
  "getAndroidDevices",
  "checkResources",
  "uploadResource",
  "preRescaleActivity",
  "preTakeScreenshot",
  "takeScreenshots",
  "takeSnapshots",
  "reportSelfHealing"
]

[[sessions.levels]]
name = "runner"
segment_prefix = "manager-"
create_command = "makeManager"
complete_commands = ["getResults", "closeBatch"]
summary_fields = ["concurrency", "batch.id"]

[[sessions.levels]]
name = "test"
segment_prefix = "eyes-"
create_command = "openEyes"
complete_commands = ["close", "abort"]

[[sessions.levels]]
name = "environment"
segment_prefix = "environment-"

# Whole-message lifecycle grammar. Correlation also requires [perf] scope fields.
[event_rules]
version = 2

[[event_rules.rules]]
id = "command-start"
[event_rules.rules.adapter]
type = "text"
pattern = 'Command (?P<name>"(?:[^"\\]|\\.)*") (?:is called)(?: (?:with (?:default driver and )?settings) (?s:.+))?'
[event_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }

[[event_rules.rules]]
id = "command-end"
[event_rules.rules.adapter]
type = "text"
pattern = 'Command (?P<name>"(?:[^"\\]|\\.)*") (?:finished|finished successfully|returned|completed)(?: (?:with settings) (?s:\{.*|\[.*))?'
[event_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
outcome = { from = "literal", value = "success" }

[[event_rules.rules]]
id = "command-identity"
[event_rules.rules.adapter]
type = "text"
pattern = 'Command (?P<name>"(?:[^"\\]|\\.)*")'
[event_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }

[[event_rules.rules]]
id = "request-start-id"
[event_rules.rules.adapter]
type = "text"
pattern = 'Request (?P<name>"(?:[^"\\]|\\.)*") \[(?P<id>[^\]\s]+)\] (?:will be sent)(?: to the address (?P<endpoint>"(?:[^"\\]|\\.)*"))?(?: (?:with body) (?s:.+))?'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
direction = { from = "literal", value = "send" }
correlation_id = { from = "capture", capture = "id" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "request-start-missing-id"
[event_rules.rules.adapter]
type = "text"
pattern = 'Request (?P<name>"(?:[^"\\]|\\.)*") (?:will be sent)(?: to the address (?P<endpoint>"(?:[^"\\]|\\.)*"))?(?: (?:with body) (?s:.+))?'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
direction = { from = "literal", value = "send" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "request-end-id"
[event_rules.rules.adapter]
type = "text"
complete_payload_capture = "body"
pattern = 'Request (?P<name>"(?:[^"\\]|\\.)*") \[(?P<id>[^\]\s]+)\] (?:finished successfully|respond with(?: [^\r\n(),]+\([0-9]{3}\)(?:, dont retry returned (?:true|false))?(?:, httpVersion: [^\s,]+)?)?|that was sent|is going to retried)(?: to the address (?P<endpoint>"(?:[^"\\]|\\.)*"))?(?: (?:respond with [^\r\n(),]+\([0-9]{3}\)(?:, dont retry returned (?:true|false))?(?:, httpVersion: [^\s,]+)?|(?:with body (?s:.+?) )?is going to retried due to (?s:.+)|with body (?P<body>(?s:\{.*|\[.*))))?[ \t]*'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
direction = { from = "literal", value = "receive" }
correlation_id = { from = "capture", capture = "id" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "request-end-missing-id"
[event_rules.rules.adapter]
type = "text"
complete_payload_capture = "body"
pattern = 'Request (?P<name>"(?:[^"\\]|\\.)*") (?:finished successfully|respond with(?: [^\r\n(),]+\([0-9]{3}\)(?:, dont retry returned (?:true|false))?(?:, httpVersion: [^\s,]+)?)?|that was sent|is going to retried)(?: to the address (?P<endpoint>"(?:[^"\\]|\\.)*"))?(?: (?:respond with [^\r\n(),]+\([0-9]{3}\)(?:, dont retry returned (?:true|false))?(?:, httpVersion: [^\s,]+)?|(?:with body (?s:.+?) )?is going to retried due to (?s:.+)|with body (?P<body>(?s:\{.*|\[.*))))?[ \t]*'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
direction = { from = "literal", value = "receive" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

# NML operation starts are distinct from HTTP sends.
[[event_rules.rules]]
id = "request-called"
[event_rules.rules.adapter]
type = "text"
pattern = 'Request (?P<name>"(?:[^"\\]|\\.)*") called(?: with settings (?s:.+))?'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }

[[event_rules.rules]]
id = "broker-send"
[event_rules.rules.adapter]
type = "text"
pattern = 'Broker request (?P<name>"(?:[^"\\]|\\.)*") will be sent to the address (?P<endpoint>"(?:[^"\\]|\\.)*")(?: with body (?s:.+))?'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
direction = { from = "literal", value = "send" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "broker-accepted"
[event_rules.rules.adapter]
type = "text"
pattern = 'Broker request (?P<name>"(?:[^"\\]|\\.)*") that was sent to the address (?P<endpoint>"(?:[^"\\]|\\.)*") respond with OK\(200\)[ \t]*'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
direction = { from = "literal", value = "receive" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "broker-poll-send"
[event_rules.rules.adapter]
type = "text"
pattern = 'Broker polling request (?P<name>"(?:[^"\\]|\\.)*") attempt #(?P<attempt>[0-9]+)/[0-9]+ will be sent to the address (?P<endpoint>"(?:[^"\\]|\\.)*")(?: with body (?s:.+))?'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
direction = { from = "literal", value = "send" }
correlation_id = { from = "capture", capture = "attempt" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "broker-poll-response"
[event_rules.rules.adapter]
type = "text"
pattern = 'Broker polling request (?P<name>"(?:[^"\\]|\\.)*") attempt #(?P<attempt>[0-9]+)/[0-9]+ that was sent to the address (?P<endpoint>"(?:[^"\\]|\\.)*") respond with [^\r\n(),]+\([0-9]{3}\)(?: with body (?s:.+))?[ \t]*'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
direction = { from = "literal", value = "receive" }
correlation_id = { from = "capture", capture = "attempt" }
endpoint = { from = "capture", capture = "endpoint", decode = "json_string" }

[[event_rules.rules]]
id = "resource-failure"
[event_rules.rules.adapter]
type = "text"
pattern = 'Resource with url (?P<url>\S+) respond with (?:Forbidden\(Forbidden\)|Not Found\(Not Found\))[ \t]*'
[event_rules.rules.mapping]
kind = "event"
name = { from = "literal", value = "resource_failure" }
phase = { from = "literal", value = "end" }
outcome = { from = "literal", value = "failure" }
endpoint = { from = "capture", capture = "url" }

[[event_rules.rules]]
id = "resource-cache"
[event_rules.rules.adapter]
type = "text"
pattern = 'resource retrieved from cache, with dependencies \([0-9]+\): (?P<url>\S+) with dependencies -->(?s:.*)'
[event_rules.rules.mapping]
kind = "event"
name = { from = "literal", value = "resource_cache" }
phase = { from = "literal", value = "end" }
endpoint = { from = "capture", capture = "url" }

[[event_rules.rules]]
id = "request-identity"
[event_rules.rules.adapter]
type = "text"
pattern = 'Request (?P<name>"(?:[^"\\]|\\.)*")'
[event_rules.rules.mapping]
kind = "request"
name = { from = "capture", capture = "name", decode = "json_string" }

[[event_rules.rules]]
id = "event-start"
[event_rules.rules.adapter]
type = "text"
pattern = '(?:Received event of type) (?P<name>"(?:[^"\\]|\\.)*")(?: with payload (?s:\{.*|\[.*))?'
[event_rules.rules.mapping]
kind = "event"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
direction = { from = "literal", value = "receive" }
correlation_id = { from = "first_field", fields = ["payload.key"] }

[[event_rules.rules]]
id = "event-start-object"
[event_rules.rules.adapter]
type = "text"
pattern = '(?:Received event of type) \{"name":(?P<name>"(?:[^"\\]|\\.)*")\}(?: with payload (?s:\{.*|\[.*))?'
[event_rules.rules.mapping]
kind = "event"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
direction = { from = "literal", value = "receive" }
correlation_id = { from = "first_field", fields = ["payload.key"] }

[[event_rules.rules]]
id = "event-end"
[event_rules.rules.adapter]
type = "text"
pattern = '(?:Emit event of type) (?P<name>"(?:[^"\\]|\\.)*")(?: with payload (?s:\{.*|\[.*))?'
[event_rules.rules.mapping]
kind = "event"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
direction = { from = "literal", value = "emit" }
correlation_id = { from = "first_field", fields = ["payload.key"] }

[[event_rules.rules]]
id = "event-end-object"
[event_rules.rules.adapter]
type = "text"
pattern = '(?:Emit event of type) \{"name":(?P<name>"(?:[^"\\]|\\.)*")\}(?: with payload (?s:\{.*|\[.*))?'
[event_rules.rules.mapping]
kind = "event"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
direction = { from = "literal", value = "emit" }
correlation_id = { from = "first_field", fields = ["payload.key"] }

[[event_rules.rules]]
id = "structured-command"
[event_rules.rules.adapter]
type = "structured"
conditions = [{ field = "operation_kind", equals = "command" }]
[event_rules.rules.mapping]
kind = "command"
name = { from = "field", field = "operation_name" }
phase = { from = "field", field = "operation_phase" }
correlation_id = { from = "first_field", fields = ["correlation_id"] }

[[event_rules.rules]]
id = "structured-request"
[event_rules.rules.adapter]
type = "structured"
conditions = [{ field = "operation_kind", equals = "request" }]
[event_rules.rules.mapping]
kind = "request"
name = { from = "field", field = "operation_name" }
phase = { from = "field", field = "operation_phase" }
correlation_id = { from = "first_field", fields = ["correlation_id"] }
direction = { from = "field", field = "operation_direction" }

[[event_rules.rules]]
id = "structured-event"
[event_rules.rules.adapter]
type = "structured"
conditions = [{ field = "operation_kind", equals = "event" }]
[event_rules.rules.mapping]
kind = "event"
name = { from = "field", field = "operation_name" }
phase = { from = "field", field = "operation_phase" }
correlation_id = { from = "first_field", fields = ["correlation_id"] }
direction = { from = "field", field = "operation_direction" }

# Domain observations are profile data, not CLI switches or runtime constants.
[[resource_observations]]
id = "snapshot-resources"
scope_field = "component_id"
scope_separator = "/"
namespace_prefix = "manager-"
owner_prefix = "check-"
manifest_marker = "blobs urls"
url_contains = "applitools-canvas-"
resource_markers = ['Request "startRenders"', "will be sent"]
resources_path = "resources"
entries_field = "entries"
url_field = "url"
hash_field = "hash"
viewport_marker = "Extracted viewport size"
viewport_reset_marker = "Taking dom snapshot for viewport size"
width_field = "width"
height_field = "height"
[[resource_observations.fingerprints]]
sha256 = "8617e027d9070bad2f37098c59e09dd1818d6af11bcef176ac1ec1cd5e3fc0a2"
label = "transparent, undrawn 300x150 Chromium PNG"

[investigation_view]
source_fields = ["component", "component_id", "event.name", "event.kind", "event.phase"]

[[investigation_view.groups]]
id = "resource-fingerprints"
title = "Resource observations by component and viewport"
max_groups = 12
select = [{path = "/details/resource_status", equals = "fingerprint_match"}]
by = [
  {label = "Component", path = "/evidence/0/fields/component"},
  {label = "Viewport", path = "/details/viewport", template = "{/width}x{/height}"},
  {label = "Fingerprint", path = "/details/fingerprint", template = "{/label}"}
]

[[investigation_view.groups]]
id = "component-performance"
title = "Performance by component"
max_groups = 8
select = [{path = "/kind", equals = "measurement"}, {path = "/details/unit", equals = "ms"}]
by = [{label = "Component", path = "/evidence/0/fields/component"}]
measurements = [
  {label = "Mean elapsed", path = "/details/value", unit_path = "/details/unit", unit = "ms", aggregate = "mean"},
  {label = "Max elapsed", path = "/details/value", unit_path = "/details/unit", unit = "ms", aggregate = "max"}
]

# Connected checkpoints use explicit role selectors and hierarchical scope keys.
# A prefix selector retains the entire path through the first matching segment;
# batched paths qualify only when every branch has the same retained path.
[investigation]
version = 1
[[investigation.roles]]
id = "checkpoint-start"
rule_ids = ["command-start", "structured-command"]
# Component labels vary across SDK generations (for example core-002).
# Roots still require the complete check/eyes hierarchy declared by the chain.
select = [{field = "event.name", equals = "check"}, {field = "event.phase", equals = "start"}, {field = "component_id.ends_at_first:check-", equals = true}]
[[investigation.roles]]
id = "capture-start"
rule_ids = ["command-start", "structured-command"]
select = [{field = "event.name", equals = "takeSnapshots"}, {field = "event.phase", equals = "start"}]
[[investigation.roles]]
id = "capture-end"
rule_ids = ["command-end", "structured-command"]
select = [{field = "event.name", equals = "takeSnapshots"}, {field = "event.phase", equals = "end"}]
[[investigation.roles]]
id = "screenshot-start"
rule_ids = ["command-start", "structured-command", "request-called", "structured-request"]
select = [{field = "event.name", equals = "takeScreenshots"}, {field = "event.phase", equals = "start"}]
[[investigation.roles]]
id = "screenshot-end"
rule_ids = ["command-end", "structured-command", "request-end-missing-id", "structured-request"]
select = [{field = "event.name", equals = "takeScreenshots"}, {field = "event.phase", equals = "end"}]
[[investigation.roles]]
id = "render-accepted"
rule_ids = ["request-end-missing-id"]
select = [{field = "event.name", equals = "startRenders"}, {field = "payload.0.status", equals = "rendering"}]
[[investigation.roles]]
id = "render-poll-send"
rule_ids = ["request-start-id"]
select = [{field = "event.name", equals = "getRenderResults"}]
[[investigation.roles]]
id = "render-poll-response"
rule_ids = ["request-end-id"]
select = [{field = "event.name", equals = "getRenderResults"}]
message_pattern = 'respond with [^\r\n(),]+\([0-9]{3}\)'
[[investigation.roles]]
id = "check-end"
rule_ids = ["command-end", "structured-command"]
select = [{field = "event.name", equals = "check"}, {field = "event.phase", equals = "end"}, {field = "component_id.ends_at_first:check-", equals = true}]
[[investigation.roles]]
id = "check-result"
rule_ids = ["request-end-missing-id"]
select = [{field = "event.name", equals = "check"}]
[[investigation.roles]]
id = "session-result"
rule_ids = ["request-end-missing-id"]
select = [{field = "event.name", equals = "close"}]

[[investigation.roles]]
id = "broker-submission"
rule_ids = ["broker-send"]
[[investigation.roles]]
id = "broker-acceptance"
rule_ids = ["broker-accepted"]
[[investigation.roles]]
id = "broker-polls"
rule_ids = ["broker-poll-send"]
[[investigation.roles]]
id = "broker-responses"
rule_ids = ["broker-poll-response"]
[[investigation.roles]]
id = "resource-failure"
rule_ids = ["resource-failure"]
[[investigation.roles]]
id = "resource-cache"
rule_ids = ["resource-cache"]
[[investigation.roles]]
id = "close-end"
rule_ids = ["command-end", "structured-command", "request-end-missing-id", "structured-request"]
select = [{field = "event.name", equals = "close"}, {field = "event.phase", equals = "end"}]

[[investigation.roles]]
id = "session-summary"
rule_ids = ["request-end-missing-id", "structured-request"]
select = [{field = "event.name", equals = "getResults"}, {field = "event.phase", equals = "end"}]

[[investigation.chains]]
id = "checkpoint"
title = "Checkpoint event chain"
root_role = "checkpoint-start"
identity_fields = ["component_id.prefix:check-"]
scope_fields = ["component_id.prefix:eyes-"]
context_fields = ["component_id.prefix:eyes-"]
[[investigation.chains.steps]]
id = "capture-start"
label = "capture requested"
role = "capture-start"
from = "$root"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_one"
event_type = "capture_submission"
[[investigation.chains.steps]]
id = "capture-end"
label = "capture completion"
role = "capture-end"
from = "capture-start"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_one"
event_type = "capture_completion"
[[investigation.chains.steps]]
id = "render-accepted"
label = "render submission accepted (rendering status)"
role = "render-accepted"
from = "$root"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_many"
event_type = "acceptance"
[[investigation.chains.steps]]
id = "screenshot-start"
label = "screenshot requested"
role = "screenshot-start"
from = "$root"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_many"
event_type = "capture_submission"
[[investigation.chains.steps]]
id = "screenshot-end"
label = "screenshot command completion"
role = "screenshot-end"
from = "screenshot-start"
join_fields = ["component_id"]
cardinality = "one_to_one"
event_type = "capture_completion"
[[investigation.chains.steps]]
id = "polls"
label = "render polls sent"
role = "render-poll-send"
from = "$root"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_many"
event_type = "poll_send"
[[investigation.chains.steps]]
id = "responses"
label = "render responses observed"
role = "render-poll-response"
from = "polls"
join_fields = ["event.correlation_id", "component_id.prefix:check-"]
cardinality = "one_to_one"
event_type = "poll_response"
[[investigation.chains.steps]]
id = "check-end"
label = "checkpoint command completion"
role = "check-end"
from = "$root"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_one"
event_type = "check_completion"
[[investigation.chains.steps]]
id = "check-result"
label = "check result (per observed environment)"
role = "check-result"
from = "$root"
join_fields = ["component_id.prefix:check-"]
cardinality = "one_to_many"
event_type = "check_result"
outcome_level = "check"
outcome_field = "payload.asExpected"
[[investigation.chains.steps]]
id = "session-result"
label = "session result (per observed environment)"
role = "session-result"
from = "$root"
join_fields = ["component_id.prefix:eyes-"]
cardinality = "one_to_many"
event_type = "session_result"
outcome_level = "session"
outcome_field = "payload.status"

[[investigation.chains.steps]]
id = "broker-submission"
label = "screenshot broker submission"
role = "broker-submission"
from = "screenshot-start"
join_fields = ["component_id"]
cardinality = "one_to_one"
event_type = "capture_submission"

[[investigation.chains.steps]]
id = "broker-acceptance"
label = "screenshot broker acceptance"
role = "broker-acceptance"
from = "broker-submission"
join_fields = ["component_id", "event.endpoint"]
cardinality = "one_to_one"
event_type = "acceptance"

[[investigation.chains.steps]]
id = "broker-polls"
label = "screenshot polls sent"
role = "broker-polls"
from = "broker-submission"
join_fields = ["component_id"]
cardinality = "one_to_many"
event_type = "poll_send"

[[investigation.chains.steps]]
id = "broker-responses"
label = "screenshot poll responses"
role = "broker-responses"
from = "broker-polls"
join_fields = ["component_id", "event.correlation_id", "event.endpoint"]
cardinality = "one_to_one"
event_type = "poll_response"

[[investigation.chains.steps]]
id = "close-end"
label = "session close operation ended (per observed scope)"
role = "close-end"
from = "$root"
join_fields = ["component_id.prefix:eyes-"]
cardinality = "one_to_many"
event_type = "session_completion"

[[investigation.chains.steps]]
id = "session-summary"
label = "first returned session summary result (not a check outcome)"
role = "session-summary"
from = "$root"
join_fields = ["component_id.prefix:eyes-"]
cardinality = "one_to_many"
event_type = "session_result"
outcome_level = "session"
outcome_field = "payload.0.status"

# A shared URL/session establishes an association, not cache contents or cause.
[[investigation.chains]]
id = "resource-cache-evidence"
title = "Failed resource and same-session cache observations"
root_role = "resource-failure"
identity_fields = ["component_id", "event.endpoint"]
scope_fields = ["component_id.prefix:eyes-"]
context_fields = ["component_id.prefix:eyes-"]
[[investigation.chains.steps]]
id = "cache-observations"
label = "same URL observed in session cache (not a new network attempt)"
role = "resource-cache"
from = "$root"
join_fields = ["event.endpoint"]
cardinality = "one_to_many"
event_type = "cache_observation"
