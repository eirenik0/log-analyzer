# Template: service-api
#
# Good for service logs with operation/request wording.
# Example lines expected by this profile:
# - gateway | ... [INFO ] Published event "OrderCreated" payload {...}
# - orders  | ... [INFO ] Request "createOrder" sent with body {...}
# - orders  | ... [INFO ] Request "createOrder" completed with body {...}
# - worker  | ... [INFO ] Operation "reconcile" started with settings {...}

profile_name = "service-api"

[parser]
event_emit_markers = ["Published event"]
event_receive_markers = ["Consumed event", "Received event"]
event_payload_separator = "payload"

command_payload_markers = ["with settings", "settings"]

request_prefix = "Request \""
request_send_markers = ["sent", "queued", "requested"]
request_receive_markers = ["completed", "responded", "failed"]
request_payload_markers = ["with body", "payload"]
request_endpoint_marker = "to \"["

json_indicators = [
  "with settings {",
  "settings {",
  "with body [",
  "with body {",
  "payload [",
  "payload {",
  "payload",
  "with body"
]

[perf]
event_correlation_keys = ["key", "traceId", "requestId"]

[profile]
known_components = ["gateway", "orders", "billing", "worker"]
known_commands = ["reconcile", "syncCache", "publish"]
known_requests = ["createOrder", "getOrder", "authorizePayment"]

[[sessions.levels]]
name = "level-1"
segment_prefix = "trace-"

[[sessions.levels]]
name = "level-2"
segment_prefix = "request-"

# Whole-message command grammar. Correlation also requires [perf] scope fields.
[command_rules]
version = 1

[[command_rules.rules]]
id = "command-start"
[command_rules.rules.adapter]
type = "text"
pattern = 'Operation (?P<name>"(?:[^"\\]|\\.)*") (?:started|begin)(?: (?:with settings|settings) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "start" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }

[[command_rules.rules]]
id = "command-end"
[command_rules.rules.adapter]
type = "text"
pattern = 'Operation (?P<name>"(?:[^"\\]|\\.)*") (?:completed|finished)(?: (?:with settings|settings) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
outcome = { from = "literal", value = "success" }

[[command_rules.rules]]
id = "command-failure"
[command_rules.rules.adapter]
type = "text"
pattern = 'Operation (?P<name>"(?:[^"\\]|\\.)*") (?:failed)(?: (?:with settings|settings) (?s:\{.*|\[.*))?'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
phase = { from = "literal", value = "end" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
outcome = { from = "literal", value = "failure" }

[[command_rules.rules]]
id = "command-identity"
[command_rules.rules.adapter]
type = "text"
pattern = 'Operation (?P<name>"(?:[^"\\]|\\.)*")'
[command_rules.rules.mapping]
kind = "command"
name = { from = "capture", capture = "name", decode = "json_string" }
correlation_id = { from = "capture", capture = "name", decode = "json_string" }
