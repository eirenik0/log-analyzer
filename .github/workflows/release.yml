name: Release

on:
  workflow_dispatch:
    inputs:
      prepared-version:
        description: 'Publish an already prepared stable version without another bump (e.g. 0.3.0)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Run without creating release (for testing)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: log-analyzer

jobs:
  # Prepare the release: update changelog and bump version
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.knope.outputs.version }}
      created: ${{ steps.knope.outputs.created }}
      revision: ${{ steps.knope.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.22.4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Select or prepare release
        id: knope
        env:
          PREPARED_VERSION: ${{ inputs.prepared-version }}
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PREPARED_VERSION" ]; then
            VERSION=$(python scripts/check-prepared-release.py "$PREPARED_VERSION")
            release_tag=$(git tag --list "v$VERSION")
            if [ -n "$release_tag" ]; then
              echo "Version $VERSION is already tagged"
              exit 1
            fi
          else
            prepare_log=$(mktemp)
            prepare_error=$(mktemp)
            trap 'rm -f "$prepare_log" "$prepare_error"' EXIT
            prepare_args=()
            if [ "$DRY_RUN" = "true" ]; then
              prepare_args=(--dry-run --verbose)
            fi
            if knope prepare-release "${prepare_args[@]}" > "$prepare_log" 2> "$prepare_error"; then
              cat "$prepare_log" "$prepare_error"
            else
              prepare_status=$?
              cat "$prepare_log" "$prepare_error"
              # Only Knope's pinned no-release diagnostic is a clean stop.
              if grep -Fxq 'Error: releases::no_release (https://knope.tech/reference/config-file/steps/prepare-release/#errors)' "$prepare_error" && git diff --cached --quiet; then
                echo "created=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit "$prepare_status"
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git diff --cached --quiet; then
              echo "No changes to release"
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            python scripts/check-prepared-release.py "$VERSION"
            git add Cargo.toml Cargo.lock .claude-plugin CHANGELOG.md .changeset
            git commit -m "chore: prepare release $VERSION"
            git push origin HEAD:main
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Validated prepared $VERSION; dry run skips publication"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Run tests to ensure the release is valid
  test:
    name: Test before release
    needs: prepare-release
    if: needs.prepare-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s evals -p 'test_*.py'
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings

  # Build binaries for all platforms
  build:
    name: Build ${{ matrix.target }}
    needs: [prepare-release, test]
    if: needs.prepare-release.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.revision }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check maintained examples against release binary
        shell: bash
        run: |
          examples_host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          examples_target="${{ matrix.target }}"
          if [ "$examples_target" != "$examples_host" ] && ! { [ "$examples_target" = "x86_64-unknown-linux-musl" ] && [ "$examples_host" = "x86_64-unknown-linux-gnu" ]; }; then
            echo "Skipping execution for cross target $examples_target on $examples_host"
            exit 0
          fi
          examples_binary="target/$examples_target/release/${{ env.BINARY_NAME }}"
          if [ -f "$examples_binary.exe" ]; then examples_binary="$examples_binary.exe"; fi
          if command -v python3 >/dev/null; then
            python3 scripts/check-examples.py "$examples_binary"
          else
            python scripts/check-examples.py "$examples_binary"
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare-release.outputs.version }}"
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.target }}.zip ${{ env.BINARY_NAME }}.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-*.${{ matrix.archive }}
          if-no-files-found: error

  # Create GitHub release with all binaries using Knope
  release:
    name: Create Release
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.revision }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.22.4

      - name: Create GitHub Release
        run: knope release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}
          gh release upload "v${VERSION}" artifacts/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
